<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Strona główna</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

  </head>
  <body>
     <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row">
        <div class="col-lg-3">
          <button
            class="btn btn-filter-toggle w-100 d-lg-none mb-3"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#filterCollapse"
            aria-expanded="false"
            aria-controls="filterCollapse"
          >
            <i class="fa-solid fa-filter me-2"></i> Pokaż filtry
          </button>

          <div class="collapse d-lg-block" id="filterCollapse">
              <form method="get" th:action="@{/produkty}">
                  <div class="filter-card p-4">
                      <h4 class="mb-3">Filtry</h4>

                      <div class="filter-group">
                          <h5 class="filter-group-title">Rozmiar</h5>
                          <div class="size-options d-flex flex-wrap gap-2">
                              <div th:each="size : ${sizes}">
                                  <input type="checkbox"
                                         name="sizeFilter"
                                         th:id="'size-' + ${size.name}"
                                         th:value="${size.name}"
                                         th:checked="${selectedSizes != null and selectedSizes.contains(size.name)}" />
                                  <label class="btn btn-sm btn-outline-secondary"
                                         th:for="'size-' + ${size.name}"
                                         th:text="${size.name}"></label>
                              </div>
                          </div>
                      </div>

                      <div class="filter-group">
                          <h5 class="filter-group-title">Kolor</h5>
                          <div class="color-swatch-list d-flex flex-wrap gap-2">
                              <label th:each="color : ${colors}"
                                     class="color-swatch"
                                     th:style="'background-color:' + ${color.hexCode}"
                                     th:title="${color.name}">
                                  <input type="checkbox"
                                         hidden
                                         name="color"
                                         th:value="${color.name}"
                                         th:checked="${selectedColors != null and selectedColors.contains(color.name)}">
                              </label>
                          </div>
                      </div>

                      <div class="filter-group">
                          <h5 class="filter-group-title">Kategorie</h5>
                          <div class="form-check mb-2" th:each="cat : ${categories}">
                              <input class="form-check-input" type="radio" name="categorySlug"
                                     th:id="${'cat-' + cat.slug}"
                                     th:value="${cat.slug}"
                                     th:checked="${selectedCategory == cat.slug}" />
                              <label class="form-check-label"
                                     th:for="${'cat-' + cat.slug}"
                                     th:text="${cat.name}"></label>
                          </div>
                      </div>

                      <div class="filter-group">
                          <h5 class="filter-group-title">Cena (zł)</h5>
                          <div class="d-flex align-items-center">
                              <input type="number" class="form-control" name="minPrice"
                                     th:value="${minPrice}" placeholder="Od" />
                              <span class="mx-2">–</span>
                              <input type="number" class="form-control" name="maxPrice"
                                     th:value="${maxPrice}" placeholder="Do" />
                          </div>
                      </div>

                      <button class="btn btn-primary-custom w-100 mt-3" type="submit">Filtruj</button>
                      <a class="btn btn-link-custom w-100 mt-2" th:href="@{/produkty}">Wyczyść filtry</a>
                  </div>
              </form>
          </div>
        </div>

        <div class="col-lg-9">
          <div
            class="d-flex justify-content-between align-items-center mb-3 sort-bar"
          >
            <h5 class="mb-0">Nasze produkty</h5>
              <select class="form-select"
                      onchange="
          const params = new URLSearchParams(window.location.search);
          const selected = this.options[this.selectedIndex];
          params.set('sortBy', selected.dataset.sortby);
          params.set('sortDir', selected.dataset.sortdir);
          params.set('page', 0);
          window.location.search = params.toString();
        ">
                  <option data-sortby="name" data-sortdir="asc"
                          th:selected="${sortBy == 'name' and sortDir == 'asc'}">Nazwa: A–Z</option>
                  <option data-sortby="name" data-sortdir="desc"
                          th:selected="${sortBy == 'name' and sortDir == 'desc'}">Nazwa: Z–A</option>
                  <option data-sortby="price" data-sortdir="asc"
                          th:selected="${sortBy == 'price' and sortDir == 'asc'}">Cena: Rosnąco</option>
                  <option data-sortby="price" data-sortdir="desc"
                          th:selected="${sortBy == 'price' and sortDir == 'desc'}">Cena: Malejąco</option>
              </select>
          </div>

            <div class="row g-4">
                <div th:each="product : ${productPage.content}" class="col-6 col-md-4 col-lg-3">
                    <div class="card product-card h-100">
                        <a th:href="@{'/produkty/' + ${product.slug}}" class="text-decoration-none">
                            <div class="product-image-wrapper position-relative">
                                <img th:if="${product.images != null and !product.images.isEmpty()}"
                                     th:src="@{'uploads' + ${product.images[0].url}}"
                                     th:alt="${product.name}"
                                     class="card-img-top object-fit-cover"
                                     >

                                <img th:unless="${product.images != null and !product.images.isEmpty()}"
                                     th:src="@{/images/noimg.png}"
                                     alt="Brak zdjęcia"
                                     class="card-img-top object-fit-cover"
                                     >
                            </div>
                        </a>
                        <div class="card-body">
                            <h6 th:text="${product.name}"></h6>
                            <span th:text="${product.formattedPrice}"></span>
                            <div class="mt-auto">
                                <a th:href="@{'/produkty/' + ${product.slug}}" class="btn btn-primary-custom w-100">
                                    Zobacz
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
      </div>
    </div>
     <!-- Paginacja (pokazuje się tylko jeśli są produkty i więcej niż 1 strona) -->
     <nav aria-label="Paginacja"
          class="mt-5 d-flex justify-content-center"
          th:if="${productPage.totalPages > 1 and !productPage.empty}">
         <ul class="pagination">

             <!-- Poprzednia -->
             <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                 <a class="page-link"
                    th:href="${productPage.first} ? '#' :
                        @{/produkty(page=${productPage.number - 1}, size=${productPage.size},
                                   sortBy=${sortBy}, sortDir=${sortDir},
                                   categorySlug=${selectedCategory},
                                   color=${selectedColors},
                                   sizeFilter=${selectedSizes},
                                   minPrice=${minPrice},
                                   maxPrice=${maxPrice},
                                   search=${param.search})}">
                     Poprzednia
                 </a>
             </li>

             <!-- Numery stron -->
             <li class="page-item"
                 th:each="pageNum : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                 th:classappend="${pageNum == currentPage} ? 'active'">
                 <a class="page-link"
                    th:text="${pageNum + 1}"
                    th:href="@{/produkty(page=${pageNum}, size=${productPage.size},
                                    sortBy=${sortBy}, sortDir=${sortDir},
                                    categorySlug=${selectedCategory},
                                    color=${selectedColors},
                                    sizeFilter=${selectedSizes},
                                    minPrice=${minPrice},
                                    maxPrice=${maxPrice},
                                    search=${param.search})}">
                 </a>
             </li>

             <!-- Następna -->
             <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                 <a class="page-link"
                    th:href="${productPage.last} ? '#' :
                        @{/produkty(page=${productPage.number + 1}, size=${productPage.size},
                                   sortBy=${sortBy}, sortDir=${sortDir},
                                   categorySlug=${selectedCategory},
                                   color=${selectedColors},
                                   sizeFilter=${selectedSizes},
                                   minPrice=${minPrice},
                                   maxPrice=${maxPrice},
                                   search=${param.search})}">
                     Następna
                 </a>
             </li>

         </ul>
     </nav>



     <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
