<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Strona główna</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

  </head>
  <body>
     <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row">
        <div class="col-lg-3">
          <button
            class="btn btn-filter-toggle w-100 d-lg-none mb-3"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#filterCollapse"
            aria-expanded="false"
            aria-controls="filterCollapse"
          >
            <i class="fa-solid fa-filter me-2"></i> Pokaż filtry
          </button>

          <div class="collapse d-lg-block" id="filterCollapse">
            <div class="filter-card p-4">
              <h4 class="mb-3">Filtry</h4>

              <div class="filter-group">
                <h5 class="filter-group-title">Rozmiar</h5>
                <div class="size-options d-flex flex-wrap gap-2">
                  <input
                    type="checkbox"
                    class="btn-check"
                    id="size-s"
                    autocomplete="off"
                  />
                  <label class="btn btn-sm btn-outline-secondary" for="size-s"
                    >S</label
                  >

                  <input
                    type="checkbox"
                    class="btn-check"
                    id="size-m"
                    autocomplete="off"
                  />
                  <label class="btn btn-sm btn-outline-secondary" for="size-m"
                    >M</label
                  >

                  <input
                    type="checkbox"
                    class="btn-check"
                    id="size-l"
                    autocomplete="off"
                  />
                  <label class="btn btn-sm btn-outline-secondary" for="size-l"
                    >L</label
                  >

                  <input
                    type="checkbox"
                    class="btn-check"
                    id="size-xl"
                    autocomplete="off"
                  />
                  <label class="btn btn-sm btn-outline-secondary" for="size-xl"
                    >XL</label
                  >

                  <input
                    type="checkbox"
                    class="btn-check"
                    id="size-xxl"
                    autocomplete="off"
                  />
                  <label class="btn btn-sm btn-outline-secondary" for="size-xxl"
                    >XXL</label
                  >
                </div>
              </div>

              <div class="filter-group">
                <h5 class="filter-group-title">Kolor</h5>
                <div class="color-swatch-list">
                  <span
                    class="color-swatch"
                    style="background-color: #222222"
                    data-bs-toggle="tooltip"
                    title="Czarny"
                  ></span>
                  <span
                    class="color-swatch"
                    style="background-color: #f5f5f5"
                    data-bs-toggle="tooltip"
                    title="Biały"
                  ></span>
                  <span
                    class="color-swatch"
                    style="background-color: #677525"
                    data-bs-toggle="tooltip"
                    title="Oliwkowy"
                  ></span>
                  <span
                    class="color-swatch"
                    style="background-color: #2e3b38"
                    data-bs-toggle="tooltip"
                    title="Grafitowy"
                  ></span>
                  <span
                    class="color-swatch"
                    style="background-color: #0d6efd"
                    data-bs-toggle="tooltip"
                    title="Niebieski"
                  ></span>
                  <span
                    class="color-swatch"
                    style="background-color: #dc3545"
                    data-bs-toggle="tooltip"
                    title="Czerwony"
                  ></span>
                </div>
              </div>

              <div class="filter-group">
                <h5 class="filter-group-title">Kategorie</h5>
                <div class="filter-options">
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="cat1"
                      checked
                    />
                    <label class="form-check-label" for="cat1">
                      Koszulki (12)
                    </label>
                  </div>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="cat2"
                    />
                    <label class="form-check-label" for="cat2">
                      Bluzy (8)
                    </label>
                  </div>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="cat3"
                    />
                    <label class="form-check-label" for="cat3">
                      Czapki (35)
                    </label>
                  </div>
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="cat4"
                    />
                    <label class="form-check-label" for="cat4">
                      Akcesoria (22)
                    </label>
                  </div>
                </div>
              </div>

              <div class="filter-group">
                <h5 class="filter-group-title">Cena (zł)</h5>
                <div class="d-flex align-items-center">
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Od"
                    aria-label="Cena minimalna"
                  />
                  <span class="mx-2">–</span>
                  <input
                    type="number"
                    class="form-control"
                    placeholder="Do"
                    aria-label="Cena maksymalna"
                  />
                </div>
              </div>

              <button class="btn btn-primary-custom w-100 mt-3">Filtruj</button>
              <button class="btn btn-link-custom w-100 mt-2">
                Wyczyść filtry
              </button>
            </div>
          </div>
        </div>

        <div class="col-lg-9">
          <div
            class="d-flex justify-content-between align-items-center mb-3 sort-bar"
          >
            <h5 class="mb-0">Nasze produkty</h5>
            <select class="form-select" aria-label="Sortuj produkty">
              <option selected>Sortuj domyślnie</option>
              <option value="1">Cena: Rosnąco</option>
              <option value="2">Cena: Malejąco</option>
              <option value="3">Nazwa: A-Z</option>
              <option value="4">Nazwa: Z-A</option>
            </select>
          </div>

          <div class="row g-4">
            <div class="col-6 col-md-4 col-lg-3">
              <div class="card product-card h-100">
                <div class="product-link-wrapper">
                  <a
                    href="/produkt/1"
                    class="product-link text-decoration-none text-dark d-block"
                  >
                    <img
                      src="../../../../../uploads/products/1/dresy.png"
                      class="card-img-top product-img"
                      alt="Zdjęcie produktu"
                    />
                    <h5 class="card-title">
                      Spodnie dresowe super premium gsgf sgsgfsd
                    </h5>
                  </a>
                </div>

                <div class="card-body d-flex flex-column pt-0">
                  <h6 class="product-price mb-2">199,99 zł</h6>
                  <div class="mt-auto">
                    <a href="#" class="btn btn-primary-custom w-100"
                      >Do koszyka</a
                    >
                  </div>
                </div>
              </div>
            </div>
            <div class="col-6 col-md-4 col-lg-3">
              <div class="card product-card h-100">
                <div class="product-link-wrapper">
                  <a
                    href="/produkt/1"
                    class="product-link text-decoration-none text-dark d-block"
                  >
                    <img
                      src="../../../../../uploads/products/1/dresy.png"
                      class="card-img-top product-img"
                      alt="Zdjęcie produktu"
                    />
                    <h5 class="card-title">
                      Spodnie dresowe gsg s dfg sgf sg sgf sfg sf
                    </h5>
                  </a>
                </div>

                <div class="card-body d-flex flex-column pt-0">
                  <div class="mt-auto">
                    <h6 class="product-price mb-2">199,99 zł</h6>
                    <a href="#" class="btn btn-primary-custom w-100"
                      >Do koszyka</a
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav
      aria-label="Nawigacja po stronie"
      class="mt-5 d-flex justify-content-center"
    >
      <ul class="pagination">
        <li class="page-item disabled">
          <a class="page-link" href="#">Poprzednia</a>
        </li>
        <li class="page-item active" aria-current="page">
          <a class="page-link" href="#">1</a>
        </li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item">
          <a class="page-link" href="#">Następna</a>
        </li>
      </ul>
    </nav>


     <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
