<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dynamiczny Slider produktów</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

   <style>
  :root {
    --slider-width: 1100px;
    --card-width: 360px;
    --card-height: 480px;
    --accent: #2b6cb0;
  }

  body {
    background: linear-gradient(120deg, #f3f4f6 0%, #e2e8f0 100%);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
    overflow: hidden; 
  }

  .slider-wrap {
    position: relative;
    width: min(95vw, var(--slider-width));
    height: var(--card-height);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .track {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1000px;
  }

  .card-slot {
    position: absolute;
    top: 50%;
    width: var(--card-width);
    height: var(--card-height);
    border-radius: 18px;
    overflow: hidden;
    background: white;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    /* ZMIANA: Usunięto flexbox, bo jest już tylko obraz */
    transition: all 0.6s cubic-bezier(.25, .8, .25, 1);
    
    /* Pozycja --i: 0 (ŚRODEK) */
    --i: 0;
    --scale: 1.1;
    --rotateY: 0deg;
    --left: 50%;
    --opacity: 1;
    --zIndex: 10;
  }

  /* Pozycja --i: 1 (Pierwszy z prawej) */
  .card-slot[style*="--i: 1"] {
    --scale: 0.9;
    --rotateY: -15deg;
    --left: 75%;
    --opacity: 0.7;
    --zIndex: 5;
  }
  
  /* Pozycja --i: -1 (Pierwszy z lewej) */
  .card-slot[style*="--i: -1"] {
    --scale: 0.9;
    --rotateY: 15deg;
    --left: 25%;
    --opacity: 0.7;
    --zIndex: 5;
  }

  /* Tryb 5-kartowy */
  .slider-mode-5 .card-slot[style*="--i: 2"] {
    --scale: 0.8;
    --rotateY: -30deg;
    --left: 90%;
    --opacity: 0.4;
    --zIndex: 1;
  }
  .slider-mode-5 .card-slot[style*="--i: -2"] {
    --scale: 0.8;
    --rotateY: 30deg;
    --left: 10%;
    --opacity: 0.4;
    --zIndex: 1;
  }
  .slider-mode-5 .card-slot[style*="--i: 3"],
  .slider-mode-5 .card-slot[style*="--i: -3"] {
    --scale: 0.7;
    --opacity: 0;
    --zIndex: 0;
  }
  .slider-mode-5 .card-slot[style*="--i: 3"] { --left: 110%; --rotateY: -45deg; }
  .slider-mode-5 .card-slot[style*="--i: -3"] { --left: -10%; --rotateY: 45deg; }

  /* Tryb 3-kartowy */
  .slider-mode-3 .card-slot[style*="--i: 2"],
  .slider-mode-3 .card-slot[style*="--i: -2"] {
    --scale: 0.8;
    --opacity: 0;
    --zIndex: 0;
  }
  .slider-mode-3 .card-slot[style*="--i: 2"] {
    --rotateY: -30deg;
    --left: 90%;
  }
  .slider-mode-3 .card-slot[style*="--i: -2"] {
    --rotateY: 30deg;
    --left: 10%;
  }

  /* Zastosowanie obliczonych zmiennych */
  .card-slot {
    transform: translate(-50%, -50%) scale(var(--scale)) rotateY(var(--rotateY));
    left: var(--left);
    opacity: var(--opacity);
    z-index: var(--zIndex);
  }

  /* --- ZMIANA SEKCJI --- */
  /* Obrazek wypełnia całą kartę */
  .card-img-top {
    width: 100%;
    height: 100%; /* ZMIANA: z 60% na 100% */
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  /* Zachowujemy efekt hover */
  .card-slot:hover .card-img-top { transform: scale(1.05); }

  /* ZMIANA: Usunięto style dla .card-body, .product-title, .product-price, .btn-buy */
  /* --- KONIEC ZMIANY SEKCJI --- */

  /* Style kontrolek (bez zmian) */
  .ctrl {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 50;
    transition: background 0.3s ease, transform 0.2s;
  }
  .ctrl:hover {
    background: white;
    transform: translateY(-50%) scale(1.05);
  }
  .ctrl-prev { left: 20px; }
  .ctrl-next { right: 20px; }
  .ctrl svg {
    width: 20px;
    height: 20px;
    stroke: #2d3748;
  }

  /* Tryb 2-kartowy (bez zmian) */
  .slider-mode-2 .card-slot[style*="--i: 1"],
  .slider-mode-2 .card-slot[style*="--i: -1"] {
    --scale: 0.9;
    --opacity: 0; 
    --zIndex: 0;
  }
  .slider-mode-2 .card-slot[style*="--i: 1"] {
    --rotateY: -15deg;
    --left: 75%;
  }
  .slider-mode-2 .card-slot[style*="--i: -1"] {
    --rotateY: 15deg;
    --left: 25%;
  }
  .slider-mode-2 .card-slot[style*="--i: 2"],
  .slider-mode-2 .card-slot[style*="--i: -2"] {
    --scale: 0.8;
    --opacity: 0;
    --zIndex: 0;
  }
  .slider-mode-2 .card-slot[style*="--i: 2"] {
    --rotateY: -30deg;
    --left: 90%;
  }
  .slider-mode-2 .card-slot[style*="--i: -2"] {
    --rotateY: 30deg;
    --left: 10%;
  }

  /* RWD (bez zmian) */
  @media (max-width: 900px) {
    :root { --card-width: 300px; --card-height: 420px; }
  }
  @media (max-width: 600px) {
    :root { 
      --card-width: 260px; 
      --card-height: 400px; 
    }
    .ctrl{
        display: none;
    }
    .slider-wrap{
        overflow-x: hidden;
    }
    .card-slot[style*="--i: 0"] {
      --scale: 1; 
    }
    .card-slot[style*="--i: 1"],
    .card-slot[style*="--i: -1"] {
      --opacity: 0.7;
      --scale: 0.8; 
      --zIndex: 5;
    }
    .card-slot[style*="--i: 1"] {
      --left: 80%; 
    }
    .card-slot[style*="--i: -1"] {
      --left: 20%; 
    }
    .card-slot[style*="--i: 2"],
    .card-slot[style*="--i: -2"] {
      --opacity: 0;
      --zIndex: 0;
    }
  }
  
  /* Animacja wejścia (bez zmian) */
  .card-slot.entering {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
  }
  .card-slot.entering.from-right {
    left: 110%;
    transform: translate(-50%, -50%) scale(0.85) rotateY(-30deg);
  }
  .card-slot.entering.from-left {
    left: -10%;
    transform: translate(-50%, -50%) scale(0.85) rotateY(30deg);
  }
  .card-slot.entering.active {
    opacity: 1;
    transition: all 0.6s ease;
    transform: translate(-50%, -50%) scale(var(--scale)) rotateY(var(--rotateY));
    left: var(--left);
  }
</style>
</head>
<body>

  <div id="product-slider-container" class="slider-container">
<div class="slider-wrap">
  <div class="track" id="track"></div>

  <button class="ctrl ctrl-prev" id="prevBtn" aria-label="Poprzednia">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="ctrl ctrl-next" id="nextBtn" aria-label="Następna">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>
</div>


<script>
// --- KONFIGURACJA ---
const products = [
  { title: "Smartwatch 1", price: "499 zł", img: "https://cdn.pixabay.com/photo/2025/10/17/09/29/nature-9899712_960_720.jpg" },
  { title: "Słuchawki 2", price: "299 zł", img: "https://media.istockphoto.com/id/1419410282/pl/zdj%C4%99cie/cichy-las-na-wiosn%C4%99-z-pi%C4%99knymi-jasnymi-promieniami-s%C5%82onecznymi.webp?s=2048x2048&w=is&k=20&c=gO5I_nFoRBDMLbL5N3H4rmjICaSgmstkH3mtfGDbcOI=" },
  { title: "Kamera 3", price: "649 zł", img: "https://cdn.pixabay.com/photo/2022/06/13/14/58/road-7260175_960_720.jpg" },
  { title: "Dron 4", price: "1299 zł", img: "https://cdn.pixabay.com/photo/2017/03/27/13/05/conifers-2178595_960_720.jpg" },
  { title: "Dron 5", price: "1299 zł", img: "https://cdn.pixabay.com/photo/2020/04/07/13/18/mist-5013325_960_720.jpg" }
];
// --- KONIEC KONFIGURACJI ---

// Obliczenia globalne
const track = document.getElementById("track");
let cardSlots = []; 
let active = 0; 
let isAnimating = false;
let dotykStartX = 0;
let dotykStartY = 0;

let VISIBLE_CARDS; 
let CENTER_INDEX;

// --- NOWE ZMIENNE DLA AUTO-PLAY ---
const AUTO_PLAY_DELAY = 2500; // Czas w ms (np. 4 sekundy)
let autoPlayInterval = null;

// Funkcja pomocnicza do pobierania produktu w pętli
function getProduct(index) {
    const n = products.length;
    const safeIndex = (index % n + n) % n;
    return products[safeIndex];
}

// --- ZMIANA ---
// Funkcja do renderowania zawartości w slocie
function renderSlot(el, product) {
  // Teraz wstawia tylko obrazek
  el.innerHTML = `
    <img src="${product.img}" class="card-img-top" alt="${product.title}">
  `;
}
// --- KONIEC ZMIANY ---

// Funkcja do aktualizacji ZAWARTOŚCI I POZYCJI
function updateSlots() {
  cardSlots.forEach((el, i) => {
    const posIndex = i - CENTER_INDEX; 
    el.style.setProperty('--i', posIndex);
    const product = getProduct(active + posIndex);
    renderSlot(el, product);
  });
}

// Funkcja animacji (bez zmian)
function animate(direction) {
  if (isAnimating) return;
  isAnimating = true;

  if (direction === 'next') {
    active = (active + 1) % products.length;
    cardSlots.forEach(el => {
      const newPos = parseInt(el.style.getPropertyValue('--i')) - 1;
      el.style.setProperty('--i', newPos);
    });
  } else {
    active = (active - 1 + products.length) % products.length;
    cardSlots.forEach(el => {
      const newPos = parseInt(el.style.getPropertyValue('--i')) + 1;
      el.style.setProperty('--i', newPos);
    });
  }

  const elementToWatch = cardSlots[CENTER_INDEX]; 
  
  elementToWatch.addEventListener('transitionend', () => {
    let slotToReset;
    
    if (direction === 'next') {
      slotToReset = cardSlots.find(el => parseInt(el.style.getPropertyValue('--i')) === -CENTER_INDEX - 1);
      slotToReset.style.transition = 'none'; 
      slotToReset.style.setProperty('--i', CENTER_INDEX); 
      renderSlot(slotToReset, getProduct(active + CENTER_INDEX)); 
    } else {
      slotToReset = cardSlots.find(el => parseInt(el.style.getPropertyValue('--i')) === CENTER_INDEX + 1);
      slotToReset.style.transition = 'none'; 
      slotToReset.style.setProperty('--i', -CENTER_INDEX); 
      renderSlot(slotToReset, getProduct(active - CENTER_INDEX)); 
    }
    
    void slotToReset.offsetWidth;
    slotToReset.style.transition = '';
    isAnimating = false;
  }, { once: true });
}

// Funkcje dotyku (bez zmian)
function obsugaStartDotyku(e) {
  dotykStartX = e.touches[0].clientX;
  dotykStartY = e.touches[0].clientY;
}
function obsugaRuchDotyku(e) {
  if (!dotykStartX || !dotykStartY) {
    return;
  }
  const aktualnyX = e.touches[0].clientX;
  const aktualnyY = e.touches[0].clientY;
  const deltaX = aktualnyX - dotykStartX;
  const deltaY = aktualnyY - dotykStartY;
  if (Math.abs(deltaX) > Math.abs(deltaY)) {
    e.preventDefault();
  }
}
function obsugaKoniecDotyku(e) {
  // Jeśli animacja jest w toku, nie rób nic
  if (isAnimating || !dotykStartX) {
    dotykStartX = 0; // Zresetuj na wszelki wypadek
    dotykStartY = 0;
    return false; // Nie było swipe'u
  }

  // Zdobądź pozycję końca dotyku
  const dotykEndX = e.changedTouches[0].clientX;
  const deltaX = dotykEndX - dotykStartX;
  const progPrzesuniecia = 50; // Minimalna odległość swipe w pikselach

  let swiped = false; // Flaga do śledzenia akcji

  // Sprawdź kierunek swipe'u
  if (deltaX < -progPrzesuniecia) {
    // Przesunięcie w lewo (palec od prawej do lewej)
    animate('next');
    swiped = true;
  } else if (deltaX > progPrzesuniecia) {
    // Przesunięcie w prawo (palec od lewej do prawej)
    animate('prev');
    swiped = true;
  }

  // Zresetuj pozycje startowe
  dotykStartX = 0;
  dotykStartY = 0;
  
  return swiped; // Zwróć, czy nastąpił swipe
}

function startAutoPlay() {
  // Wyczyść stary interwał, jeśli istnieje
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
  }
  // Ustaw nowy interwał
  autoPlayInterval = setInterval(() => {
    animate('next');
  }, AUTO_PLAY_DELAY);
}

function stopAutoPlay() {
  // Zatrzymaj interwał
  clearInterval(autoPlayInterval);
}

// Inicjalizacja (bez zmian)
function init() {
  const numProducts = products.length;
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const sliderWrap = document.querySelector('.slider-wrap'); // Pobierz slider-wrap

  // Scenariusz 1: 1 produkt (bez zmian)
  if (numProducts === 1) {
    // Ukryj przyciski
    nextBtn.style.display = 'none';
    prevBtn.style.display = 'none';
    
    // Ustaw konfigurację dla 1 karty
    VISIBLE_CARDS = 1;
    CENTER_INDEX = 0;
    
    // Stwórz tylko jeden slot
    const slot = document.createElement('div');
    slot.classList.add('card-slot');
    track.appendChild(slot);
    cardSlots.push(slot);
    
    // Ustaw pozycję i zawartość
    updateSlots(); 
    return; // Zakończ inicjalizację (i nie uruchamiaj auto-play)
  }

  // --- Logika trybów (bez zmian) ---
  if (numProducts === 2) {
    VISIBLE_CARDS = 3; 
    document.body.classList.add('slider-mode-2'); 
  } 
  else if (numProducts >= 3 && numProducts <= 4) {
    VISIBLE_CARDS = 3;
    document.body.classList.add('slider-mode-3');
  } 
  else {
    VISIBLE_CARDS = 5;
    document.body.classList.add('slider-mode-5');
  }
  
  CENTER_INDEX = Math.floor(VISIBLE_CARDS / 2);

  // 1. Stwórz sloty DOM (bez zmian)
  for (let i = 0; i < VISIBLE_CARDS; i++) {
    const slot = document.createElement('div');
    slot.classList.add('card-slot');
    track.appendChild(slot);
    cardSlots.push(slot);
  }

  // 2. Ustaw zawartość (bez zmian)
  updateSlots();

  // --- ZMIANA: Logika eventów ---

  // 3. Podepnij kliknięcia (z resetem auto-play)
  nextBtn.addEventListener('click', () => {
    animate('next');
    startAutoPlay(); // Resetuj timer po kliknięciu
  });
  prevBtn.addEventListener('click', () => {
    animate('prev');
    startAutoPlay(); // Resetuj timer po kliknięciu
  });

  // 4. Podepnij obsługę dotyku (z resetem auto-play)
  track.addEventListener('touchstart', obsugaStartDotyku, { passive: false });
  track.addEventListener('touchmove', obsugaRuchDotyku, { passive: false });
  track.addEventListener('touchend', (e) => {
    const swiped = obsugaKoniecDotyku(e); // Sprawdź, czy był swipe
    if (swiped) {
      startAutoPlay(); // Jeśli tak, zresetuj timer
    }
  });

  // 5. (NOWE) Podepnij pauzę przy najechaniu myszką
  sliderWrap.addEventListener('mouseenter', stopAutoPlay);
  sliderWrap.addEventListener('mouseleave', startAutoPlay);

  // 6. (NOWE) Uruchom auto-play po raz pierwszy
  startAutoPlay();
}

init();
</script>

</body>
</html>
