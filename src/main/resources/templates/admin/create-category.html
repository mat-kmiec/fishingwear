<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Panel Admina - Kategorie Produktów</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

    <style>
      

    </style>
  </head>
  <body style="background-color: var(--color-neutral-light)">
  <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row g-4">

          <div class="col-lg-4">
              <div th:replace="fragments/admin-sidebar :: adminSidebar('category-product')"></div>
          </div>

        <div class="col-lg-8">
          <h2 class="h3 mb-4">Kategorie produktów</h2>

          <div class="row g-4">
            
            <div class="col-lg-7">
              <div class="account-card p-4">
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead>
                      <tr>
                        <th scope="col">Nazwa</th>
                        <th scope="col">Slug</th>
                        <th scope="col">Ilość</th>
                        <th scope="col">Akcje</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td class="fw-bold">Odzież</td>
                        <td>odziez</td>
                        <td>25</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                      <tr>
                        <td class="subcategory-name">Bluzy</td>
                        <td>bluzy</td>
                        <td>8</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                      <tr>
                        <td class="subcategory-name">Spodnie</td>
                        <td>spodnie</td>
                        <td>5</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                      <tr>
                        <td class="subcategory-name">T-shirty</td>
                        <td>t-shirty</td>
                        <td>12</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                      <tr>
                        <td class="fw-bold">Gadżety</td>
                        <td>gadzety</td>
                        <td>15</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                      <tr>
                        <td class="fw-bold">Akcesoria</td>
                        <td>akcesoria</td>
                        <td>32</td>
                        <td>
                          <a href="#" class="btn-link-custom me-2"><i class="fa-solid fa-pen-to-square"></i></a>
                          <a href="#" class="btn-link-custom text-danger"><i class="fa-solid fa-trash-can"></i></a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            
            <div class="col-lg-5">
              <div class="category-form">
                <h5 class="mb-3" id="categoryFormLabel">Dodaj nową kategorię</h5>
                <form>
                  <div class="mb-3">
                    <label for="catName" class="form-label">Nazwa</label>
                    <input type="text" class="form-control" id="catName" required>
                  </div>
                  <div class="mb-3">
                    <label for="catSlug" class="form-label">Uproszczona nazwa (slug)</label>
                    <input type="text" class="form-control" id="catSlug" placeholder="np. spodnie-dresowe">
                    <small class="text-secondary">Tylko małe litery, cyfry i myślniki.</small>
                  </div>
                  <div class="mb-3">
                    <label for="catParent" class="form-label">Kategoria nadrzędna</label>
                    <select class="form-select" id="catParent">
                      <option value="0">Brak (główna kategoria)</option>
                      <option value="1">- Odzież</option>
                      <option value="2">- Gadżety</option>
                      <option value="3">- Akcesoria</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="catDesc" class="form-label">Opis</label>
                    <textarea class="form-control" id="catDesc" rows="3"></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary-custom w-100">Dodaj kategorię</button>
                </form>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </div>

  <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
    
  </body>
</html>
