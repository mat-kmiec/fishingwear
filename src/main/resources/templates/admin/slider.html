<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Panel Admina - Kolekcje Slidera</title>
      <th:block th:insert="fragments/head-styles :: theme-styles" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

  </head>
  <body style="background-color: var(--color-neutral-light)">
  <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row g-4">

          <div class="col-lg-4">
              <div th:replace="fragments/admin-sidebar :: adminSidebar('slider')"></div>
          </div>

        <div class="col-lg-8">
          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 mb-0">Kolekcje Slidera</h2>
            <a href="#" th:href="@{/admin/slider/edycja}" class="btn btn-primary-custom">
              <i class="fa-solid fa-plus me-2"></i>Dodaj nową kolekcję
            </a>
          </div>

          <div class="account-card p-4">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th scope="col">Nazwa Kolekcji</th>
                    <th scope="col">Ilość zdjęć</th>
                    <th scope="col">Status</th>
                    <th scope="col">Akcje</th>
                  </tr>
                </thead>
                <tbody>
                  
                  <tr>
                    <td class="fw-bold">Główna strona - slider</td>
                    <td>5</td>
                    <td>
                      <span class="badge badge-status completed">Aktywna</span>
                    </td>
                    <td>
                      <a href="#" class="btn-link-custom me-3">Edytuj</a>
                      <a href="#" class="btn-link-custom text-danger me-3">Usuń</a>
                      <span class="text-success fw-bold">
                        <i class="fa-solid fa-check me-1"></i>Aktywny
                      </span>
                    </td>
                  </tr>
                  
                  <tr>
                    <td class="fw-bold">Promocje zimowe</td>
                    <td>3</td>
                    <td>
                      <span class="badge badge-status cancelled">Nieaktywna</span>
                    </td>
                    <td>
                      <a href="#" class="btn-link-custom me-3">Edytuj</a>
                      <a href="#" class="btn-link-custom text-danger me-3">Usuń</a>
                      <a href="#" class="btn-link-custom">Ustaw jako aktywny</a>
                    </td>
                  </tr>

                  <tr>
                    <td class="fw-bold">Nowa kolekcja - Wiosna</td>
                    <td>8</td>
                    <td>
                      <span class="badge badge-status cancelled">Nieaktywna</span>
                    </td>
                    <td>
                      <a href="#" class="btn-link-custom me-3">Edytuj</a>
                      <a href="#" class="btn-link-custom text-danger me-3">Usuń</a>
                      <a href="#" class="btn-link-custom">Ustaw jako aktywny</a>
                    </td>
                  </tr>
                  
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>

  <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>

  </body>
</html>
