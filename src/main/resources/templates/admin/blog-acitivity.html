<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Centrum Powiadomień</title>
    <th:block th:insert="fragments/head-styles :: theme-styles" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />

    <style>
        .notification-item {
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }
        /* Różne kolory lewej krawędzi zależnie od typu zdarzenia */
        .notification-unread { background-color: #f8f9ff; border-left-color: var(--color-primary); }
        .type-comment { border-left-color: #ffc107; } /* Żółty dla komentarzy */
        .type-post { border-left-color: #28a745; }    /* Zielony dla nowych wpisów */
        .type-system { border-left-color: #17a2b8; }  /* Niebieski dla systemowych */

        .notification-dot {
            height: 10px;
            width: 10px;
            background-color: var(--color-primary);
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body style="background-color: var(--color-neutral-light)">
<nav th:insert="~{fragments/nav :: nav}"></nav>

<div class="container my-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <div th:replace="fragments/admin-sidebar :: adminSidebar('blog-activity')"></div>
        </div>

        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 mb-0">Centrum Powiadomień</h2>
                <form th:action="@{/admin/activity/mark-all-read}" method="POST">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        Oznacz wszystkie jako przeczytane
                    </button>
                </form>
            </div>

            <div class="card shadow-sm border-0">
                <div class="list-group list-group-flush">

                    <div th:each="notif : ${notificationPage.content}"
                         class="list-group-item notification-item p-4"
                         th:classappend="${!notif.read ? 'notification-unread' : ''} + ' ' + ${'type-' + notif.type}">

                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex">
                                <div class="me-3 mt-1">
                                    <i th:if="${notif.type == 'comment'}" class="fa-solid fa-comments text-warning fs-4"></i>
                                    <i th:if="${notif.type == 'post'}" class="fa-solid fa-file-pen text-success fs-4"></i>
                                    <i th:if="${notif.type == 'system'}" class="fa-solid fa-circle-exclamation text-info fs-4"></i>
                                </div>
                                <div>
                                    <div class="d-flex align-items-center mb-1">
                                        <h6 class="mb-0 fw-bold" th:text="${notif.title}">Nowy komentarz oczekuje na akceptację</h6>
                                        <span th:if="${!notif.read}" class="notification-dot ms-2" title="Nowe"></span>
                                    </div>
                                    <p class="text-muted mb-2" th:text="${notif.message}">
                                        Użytkownik Jan Kowalski dodał komentarz pod wpisem "Jak wybrać wędkę".
                                    </p>
                                    <small class="text-secondary">
                                        <i class="fa-regular fa-clock me-1"></i>
                                        <span th:text="${#temporals.format(notif.createdAt, 'dd.MM.yyyy HH:mm')}">12.12.2025 10:00</span>
                                    </small>
                                </div>
                            </div>

                            <a th:href="${notif.targetUrl}" class="btn btn-sm btn-light border">
                                Szczegóły <i class="fa-solid fa-chevron-right ms-1"></i>
                            </a>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(notificationPage.content)}" class="p-5 text-center">
                        <i class="fa-solid fa-bell-slash fs-1 text-light mb-3"></i>
                        <p class="text-secondary">Nie masz jeszcze żadnych powiadomień.</p>
                    </div>
                </div>
            </div>

            <nav th:if="${notificationPage.totalPages > 1}" aria-label="Nawigacja" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${notificationPage.first ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/activity(page=${notificationPage.number - 1})}">Poprzednia</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, notificationPage.totalPages - 1)}"
                        th:classappend="${notificationPage.number == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/admin/activity(page=${i})}" th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${notificationPage.last ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/admin/activity(page=${notificationPage.number + 1})}">Następna</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>
<script th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
