<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Panel Admina - Nowy Wpis</title>

    <th:block th:insert="~{fragments/head-styles :: theme-styles}" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}" href="../../static/libs/bootstrap/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css"/>

    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">

    <style>
        /* Stylizacja edytora pod motyw */
        .note-editor.note-frame {
            border-color: #dee2e6;
            border-radius: 0.5rem;
            box-shadow: none;
        }
        .note-toolbar {
            background-color: var(--color-neutral-light) !important;
            border-bottom: 1px solid #dee2e6 !important;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        .note-editor .note-statusbar {
            border-radius: 0 0 0.5rem 0.5rem;
        }

        /* Stylizacja podglądu zdjęcia */
        .image-upload-wrapper {
            position: relative;
            height: 250px;
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .image-upload-wrapper:hover {
            border-color: var(--color-primary);
            background-color: #fff;
        }
        .image-upload-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Domyślnie ukryte */
        }
        .image-upload-placeholder {
            text-align: center;
            color: #6c757d;
        }
        .btn-upload-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 10;
        }
    </style>
</head>
<body style="background-color: var(--color-neutral-light)">

<nav th:insert="~{fragments/nav :: nav}"></nav>

<div class="container my-5">
    <div class="row g-4">

        <div class="col-lg-4">
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar('blog-manage')}"></div>
        </div>

        <div class="col-lg-8">

            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/admin}">Panel Admina</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/admin/blog}">Blog</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Kreator wpisu</li>
                    </ol>
                </nav>
            </div>

            <form action="/admin/blog/posts/create" method="POST" enctype="multipart/form-data">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h3 mb-0">Nowy artykuł</h2>
                    <div class="d-flex gap-2">
                        <button type="submit" name="action" value="publish" class="btn btn-primary-custom px-4">
                            <i class="fa-solid fa-paper-plane me-2"></i>Opublikuj
                        </button>
                    </div>
                </div>

                <div class="account-card p-4 p-md-5 mb-4">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold text-uppercase small text-secondary">Tytuł artykułu</label>
                        <input type="text" class="form-control form-control-lg fw-bold" id="title" name="title" placeholder="Wpisz chwytliwy tytuł..." required>
                    </div>
                    <div class="mb-0">
                        <label for="content" class="form-label fw-bold text-uppercase small text-secondary">Treść</label>
                        <textarea id="content" name="content" required></textarea>
                    </div>
                </div>

                <div class="row g-4">

                    <div class="col-md-6">

                        <div class="account-card p-4 mb-4 h-100">
                            <h5 class="h6 fw-bold mb-3 border-bottom pb-2">Zdjęcie wyróżniające</h5>

                            <div class="image-upload-wrapper mb-3">
                                <img id="imagePreview" src="#" alt="Podgląd" class="image-upload-preview">
                                <div class="image-upload-placeholder" id="imagePlaceholder">
                                    <i class="fa-regular fa-image fa-3x mb-2"></i>
                                    <p class="small mb-0">Kliknij przycisk poniżej,<br>aby dodać zdjęcie</p>
                                </div>
                            </div>

                            <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*" required onchange="previewFile()">
                            <div class="form-text small mt-2">Zalecany rozmiar: 1200x630px (Max 5MB)</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="account-card p-4 mb-4 h-100">
                            <h5 class="h6 fw-bold mb-3 border-bottom pb-2">Dodatkowe:</h5>

                            <div class="mb-3">
                                <label for="category" class="form-label small fw-bold">Kategoria <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" name="categoryId" required>
                                    <option value="" selected disabled>-- Wybierz kategorię --</option>
                                    <option value="1">Poradniki wędkarskie</option>
                                    <option value="2">Sprzęt i recenzje</option>
                                    <option value="3">Relacje z wypraw</option>
                                    <option value="4">Lifestyle</option>
                                </select>
                            </div>
                        </div>
                    </div>

                </div>

            </form>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}" src="../../static/libs/bootstrap/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>

<script>
    // 1. Inicjalizacja Summernote (Edytor)
    $(document).ready(function() {
        $('#content').summernote({
            placeholder: 'Tutaj wpisz treść swojego artykułu...',
            tabsize: 2,
            height: 450,
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'video', 'hr']],
                ['view',]
            ],
            // lang: 'pl-PL' // Odkomentuj jeśli masz plik językowy
        });
    });

    // 2. Podgląd zdjęcia (Vanilla JS)
    function previewFile() {
        const preview = document.getElementById('imagePreview');
        const placeholder = document.getElementById('imagePlaceholder');
        const file = document.getElementById('imageFile').files[0];
        const reader = new FileReader();

        reader.addEventListener("load", function () {
            preview.src = reader.result;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        }, false);

        if (file) {
            reader.readAsDataURL(file);
        }
    }



</script>

</body>
</html>
