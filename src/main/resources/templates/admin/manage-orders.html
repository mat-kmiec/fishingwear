<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Panel Admina - Zamówienia</title>
    <th:block th:insert="fragments/head-styles :: theme-styles" />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
            rel="stylesheet"
            th:href="@{/libs/bootstrap/bootstrap.min.css}"
            href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}"
            href="../../static/css/style.css"
    />
    <link
            rel="stylesheet"
            th:href="@{/css/slider.css}"
            href="../../static/css/slider.css"
    />

    <style>
        .badge-status { font-weight: 500; font-size: 0.85em; padding: 0.5em 0.8em; }
        .badge-new { background-color: #e3f2fd; color: #0d47a1; } /* Niebieski */
        .badge-pending { background-color: #fff3e0; color: #e65100; } /* Pomarańczowy */
        .badge-processing { background-color: #f3e5f5; color: #7b1fa2; } /* Fioletowy */
        .badge-shipped { background-color: #e8f5e9; color: #1b5e20; } /* Zielony */
        .badge-canceled {
            background-color: #ffebee; /* Bardzo jasny czerwony (pastelowy) */
            color: #c62828;            /* Ciemny, wyraźny czerwony tekst */
        }
    </style>
</head>
<body style="background-color: var(--color-neutral-light)">
<nav th:insert="~{fragments/nav :: nav}"></nav>

<div class="container my-5">
    <div class="row g-4">

        <div class="col-lg-4">
            <div th:replace="fragments/admin-sidebar :: adminSidebar('order-manage')"></div>
        </div>

        <div class="col-lg-8">
            <h2 class="h3 mb-4">Zarządzanie Zamówieniami</h2>

            <!-- Sekcja Filtrów -->
            <div class="account-card p-4 mb-4 bg-white shadow-sm rounded">
                <form th:action="@{/admin/zamowienia}" method="get">
                    <div class="row g-3">
                        <div class="col-md-12 col-lg-4">
                            <label for="searchQuery" class="form-label small text-muted fw-bold">Szukaj</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-search text-secondary"></i></span>
                                <input type="text" name="searchQuery" id="searchQuery" class="form-control border-start-0 ps-0"
                                       placeholder="ID, nazwisko, email..." th:value="${currentSearch}">
                            </div>
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="statusFilter" class="form-label small text-muted fw-bold">Status zamówienia</label>
                            <select name="statusFilter" id="statusFilter" class="form-select">
                                <option value="">Wszystkie statusy</option>
                                <option th:each="status : ${allStatuses}"
                                        th:value="${status}"
                                        th:text="${status}"
                                        th:selected="${status == currentStatus}"></option>
                            </select>
                        </div>

                        <div class="col-md-6 col-lg-3">
                            <label for="dateFilter" class="form-label small text-muted fw-bold">Data od</label>
                            <input type="date" name="dateFilter" id="dateFilter" class="form-control"
                                   th:value="${currentDate}">
                        </div>

                        <div class="col-lg-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary-custom w-100">Filtruj</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Jedna lista zamówień -->
            <div class="account-card p-0 bg-white shadow-sm rounded overflow-hidden">
                <div class="table-responsive">
                    <!-- Dodano klasę text-nowrap, aby zapobiec łamaniu się tekstu i wymusić scroll na mobile -->
                    <table class="table table-hover mb-0 align-middle text-nowrap">
                        <thead class="bg-light">
                        <tr>
                            <th scope="col" class="py-3 ps-4">ID</th>
                            <th scope="col" class="py-3">Klient</th>
                            <th scope="col" class="py-3">Data</th>
                            <th scope="col" class="py-3">Status</th>
                            <th scope="col" class="py-3">Suma</th>
                            <th scope="col" class="py-3 pe-4 text-end">Akcje</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${ordersPage.content}">
                            <td class="fw-bold ps-4 text-primary" th:text="'#' + ${order.id}">#10025</td>
                            <td>
                                <div class="d-flex flex-column">
                                    <span class="fw-bold" th:text="${order.customerName}">Alicja Testowa</span>
                                    <small class="text-muted" th:text="${order.customerEmail}">alicja@example.com</small>
                                </div>
                            </td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}">07.11.2025</td>


                            <td>
    <span class="badge rounded-pill"
          th:classappend="|badge-${#strings.toLowerCase(order.status)}|"
          th:text="${order.status}">Nowe</span>
                            </td>
                            <td class="fw-bold" th:text="${order.totalAmount} + ' zł'">299,98 zł</td>

                            <td class="pe-4 text-end">
                                <a th:href="@{/admin/zamowienia/szczegoly/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-primary-custom ms-1">
                                    Zarządzaj
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${ordersPage.empty}">
                            <td colspan="6" class="text-center py-4 text-muted">Brak zamówień spełniających kryteria.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav aria-label="Nawigacja po zamówieniach" class="mt-4 d-flex justify-content-between align-items-center"
                 th:if="${ordersPage.totalPages > 0}">

                <small class="text-muted">
                    Strona <span th:text="${ordersPage.number + 1}">1</span> z <span th:text="${ordersPage.totalPages}">10</span>
                </small>

                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${ordersPage.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/orders(page=${ordersPage.number - 1}, searchQuery=${currentSearch}, statusFilter=${currentStatus}, dateFilter=${currentDate})}">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                    </li>

                    <li class="page-item active">
                        <span class="page-link" th:text="${ordersPage.number + 1}">1</span>
                    </li>

                    <li class="page-item" th:classappend="${ordersPage.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/orders(page=${ordersPage.number + 1}, searchQuery=${currentSearch}, statusFilter=${currentStatus}, dateFilter=${currentDate})}">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script
        th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
        src="../../static/libs/bootstrap/bootstrap.bundle.min.js"
></script>

</body>
</html>
