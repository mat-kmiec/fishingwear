<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Panel Admina - Dodaj Produkt</title>
      <th:block th:insert="fragments/head-styles :: theme-styles" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

    <style>
      

    </style>
  </head>
  <body style="background-color: var(--color-neutral-light)">
  <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row g-4">

          <div class="col-lg-4">
              <div th:replace="fragments/admin-sidebar :: adminSidebar('new-product')"></div>
          </div>

        <div class="col-lg-8">
          
          <form>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="h3 mb-0">Dodaj nowy produkt</h2>
              <button type="submit" class="btn btn-primary-custom btn-lg">
                <i class="fa-solid fa-save me-2"></i>Opublikuj produkt
              </button>
            </div>

            <div class="row g-4">
              
              <div class="col-lg-8">
                
                <div class="account-card p-4 mb-4">
                  <label for="productName" class="form-label fs-5 fw-bold">Nazwa produktu</label>
                  <input type="text" class="form-control form-control-lg" id="productName" placeholder="Np. Spodnie dresowe super premium" required>
                </div>
                
                <div class="account-card p-4 mb-4">
                  <h3 class="h5 mb-3">Opis</h3>
                  <div class="fake-editor">

                  </div>
                </div>
                
                <div class="account-card p-4">
                  <h3 class="h5 mb-3">Zdjęcia produktu (n)</h3>
                  <div class="dropzone-wrapper" id="dropzone-wrapper">
                    <label for="file-input" class="dropzone">
                      <i class="fa-solid fa-camera-retro dropzone-icon"></i>
                      <span class="dropzone-text">
                        Przeciągnij i upuść zdjęcia
                      </span>
                      <span class="text-secondary my-2">LUB</span>
                      <span class="btn btn-primary-custom btn-sm">
                        Wybierz pliki
                      </span>
                    </label>
                    <input type="file" id="file-input" multiple>
                  </div>
                  <div class="preview-grid mt-4" id="preview-area"></div>
                </div>
                
              </div>

              <div class="col-lg-4">
                <div class="sidebar-sticky">
                  
                  <div class="account-card p-4 mb-4">
                    <h3 class="h5 mb-3">Cena</h3>
                    <div class="mb-3">
                      <label for="productPrice" class="form-label">Cena regularna (zł)</label>
                      <input type="number" class="form-control" id="productPrice" placeholder="np. 199.99" step="0.01" required>
                    </div>
                    <div>
                      <label for="productSalePrice" class="form-label">Cena promocyjna (zł)</label>
                      <input type="number" class="form-control" id="productSalePrice" placeholder="np. 149.99" step="0.01">
                      <small class="text-secondary">Pozostaw puste, jeśli brak promocji.</small>
                    </div>
                  </div>
                  
                  <div class="account-card p-4 mb-4">
                    <h3 class="h5 mb-3">Stan magazynowy</h3>
                    <div class="mb-3">
                      <label for="productSKU" class="form-label">SKU (Indeks)</label>
                      <input type="text" class="form-control" id="productSKU" placeholder="np. FW-DRS-GRF-XL">
                    </div>
                    <div>
                      <label for="productStock" class="form-label">Ilość na stanie</label>
                      <input type="number" class="form-control" id="productStock" placeholder="0" step="1" required>
                    </div>
                  </div>
                  
                  <div class="account-card p-4">
                    <h3 class="h5 mb-3">Kategorie produktu</h3>
                    <div class="category-list-wrapper">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="cat1">
                        <label class="form-check-label" for="cat1">Odzież</label>
                      </div>
                      <div class="form-check child">
                        <input class="form-check-input" type="checkbox" value="" id="cat2">
                        <label class="form-check-label" for="cat2">Bluzy</label>
                      </div>
                      <div class="form-check child">
                        <input class="form-check-input" type="checkbox" value="" id="cat3" checked>
                        <label class="form-check-label" for="cat3">Spodnie</label>
                      </div>
                      <div class="form-check child">
                        <input class="form-check-input" type="checkbox" value="" id="cat4">
                        <label class="form-check-label" for="cat4">T-shirty</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="cat5">
                        <label class="form-check-label" for="cat5">Gadżety</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="cat6">
                        <label class="form-check-label" for="cat6">Akcesoria</label>
                      </div>
                    </div>
                  </div>
                  
                </div>
              </div>
            </div>
          </form>
          
        </div>
      </div>
    </div>

  <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
    
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const dropzoneWrapper = document.getElementById("dropzone-wrapper");
        const fileInput = document.getElementById("file-input");
        const previewArea = document.getElementById("preview-area");
        
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        dropzoneWrapper.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropzoneWrapper.classList.add("dragover");
        });

        dropzoneWrapper.addEventListener("dragleave", () => {
          dropzoneWrapper.classList.remove("dragover");
        });

        dropzoneWrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          dropzoneWrapper.classList.remove("dragover");
          fileInput.files = e.dataTransfer.files;
          handleFiles(fileInput.files);
        });

        fileInput.addEventListener("change", () => {
          handleFiles(fileInput.files);
        });

        function handleFiles(files) {
          previewArea.innerHTML = "";
          if (!files.length) return;

          for (const file of files) {
            if (!file.type.startsWith("image/")) continue;
            
            const reader = new FileReader();
            
            reader.onload = (e) => {
              const previewCard = document.createElement("div");
              previewCard.className = "preview-card";
              previewCard.innerHTML = `
                <img src="${e.target.result}" alt="Podgląd ${file.name}" class="preview-img">
                <div class="preview-info">
                  <strong>${file.name}</strong>
                  <span>${formatBytes(file.size)}</span>
                </div>
                <button type="button" class="preview-remove" data-name="${file.name}">&times;</button>
              `;
              previewArea.appendChild(previewCard);
            };
            
            reader.readAsDataURL(file);
          }
        }
        
        previewArea.addEventListener("click", (e) => {
            if (e.target.classList.contains("preview-remove")) {
                const card = e.target.closest(".preview-card");
                card.remove();
            }
        });
      });
    </script>
  </body>
</html>
