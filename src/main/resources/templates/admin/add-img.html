<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale-1.0" />
    <title>FishingWear - Panel Admina - Dodaj Zdjęcia</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

  </head>
  <body style="background-color: var(--color-neutral-light)">
  <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row g-4">
        
        <div class="col-lg-4">
          <div class="account-card p-4">
            <h3 class="h5 mb-3" style="color: var(--color-accent);">Panel Administratora</h3>
            <nav class="nav nav-pills flex-column account-nav">
              <a class="nav-link" href="#">Przegląd</a>
              <a class="nav-link" href="#">Zarządzanie Użytkownikami</a>
              <a class="nav-link" href="#">Zarządzanie Blogiem</a>
              
              <hr class="my-2">
              <h6 class="nav-link disabled text-uppercase small fw-bold text-secondary ps-3 pt-3 pb-0">Slider</h6>
              <a class="nav-link active" aria-current="page" href="#">Dodaj zdjęcia do bazy</a>
              <a class="nav-link" href="#">Kolekcje Slidera</a>
              
              <hr class="my-2">
              <a class="nav-link" href="#">Ustawienia Główne</a>
              <a class="nav-link" href="#">Wyloguj się</a>
            </nav>
          </div>
        </div>

        <div class="col-lg-8">
          <h2 class="h3 mb-4">Dodaj zdjęcia do Bazy</h2>

          <div class="account-card p-4 p-md-5">
            <form id="upload-form">
              <div class="dropzone-wrapper" id="dropzone-wrapper">
                <label for="file-input" class="dropzone">
                  <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
                  <span class="dropzone-text">
                    Przeciągnij i upuść pliki tutaj
                  </span>
                  <span class="text-secondary my-2">LUB</span>
                  <span class="btn btn-primary-custom btn-sm">
                    Wybierz pliki
                  </span>
                </label>
                <input type="file" id="file-input" multiple>
              </div>
              
              <small class="form-text text-secondary mt-2 d-block">
                <i class="fa-solid fa-info-circle fa-sm me-1"></i>
                Wszystkie zdjęcia zostaną automatycznie przeskalowane i zoptymalizowane.
              </small>

              <div class="preview-grid mt-4" id="preview-area">
                </div>
              
              <div class="text-end mt-4">
                <button type="submit" class="btn btn-primary-custom btn-lg">
                  <i class="fa-solid fa-upload me-2"></i> Wyślij pliki do bazy
                </button>
              </div>
              
            </form>
          </div>

        </div>
      </div>
    </div>

  <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
    
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const dropzoneWrapper = document.getElementById("dropzone-wrapper");
        const fileInput = document.getElementById("file-input");
        const previewArea = document.getElementById("preview-area");
        
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        dropzoneWrapper.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropzoneWrapper.classList.add("dragover");
        });

        dropzoneWrapper.addEventListener("dragleave", () => {
          dropzoneWrapper.classList.remove("dragover");
        });

        dropzoneWrapper.addEventListener("drop", (e) => {
          e.preventDefault();
          dropzoneWrapper.classList.remove("dragover");
          fileInput.files = e.dataTransfer.files;
          handleFiles(fileInput.files);
        });

        fileInput.addEventListener("change", () => {
          handleFiles(fileInput.files);
        });

        function handleFiles(files) {
          previewArea.innerHTML = ""; 
          if (!files.length) return;

          for (const file of files) {
            if (!file.type.startsWith("image/")) continue;
            
            const reader = new FileReader();
            
            reader.onload = (e) => {
              const previewCard = document.createElement("div");
              previewCard.className = "preview-card";
              previewCard.innerHTML = `
                <img src="${e.target.result}" alt="Podgląd ${file.name}" class="preview-img">
                <div class="preview-info">
                  <strong>${file.name}</strong>
                  <span>${formatBytes(file.size)}</span>
                </div>
                <button type="button" class="preview-remove" data-name="${file.name}">&times;</button>
              `;
              previewArea.appendChild(previewCard);
            };
            
            reader.readAsDataURL(file);
          }
        }
        
        previewArea.addEventListener("click", (e) => {
            if (e.target.classList.contains("preview-remove")) {
                const card = e.target.closest(".preview-card");
                card.remove();
            }
        });
        
        document.getElementById("upload-form").addEventListener("submit", (e) => {
            e.preventDefault();
            alert(`Wysłano ${previewArea.childElementCount} plików na serwer (symulacja).`);
            previewArea.innerHTML = "";
            fileInput.value = ""; 
        });

      });
    </script>
  </body>
</html>
