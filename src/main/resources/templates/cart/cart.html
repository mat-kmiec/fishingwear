<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>FishingWear - Twój koszyk</title>
    <th:block th:insert="fragments/head-styles :: theme-styles" />

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/slider.css}"/>
</head>

<body style="background-color: var(--color-neutral-light)">
<nav th:insert="~{fragments/nav :: nav}"></nav>

<div class="container my-5" style="min-height: 50vh;">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="cart-card p-4">
                <h2 class="h4 mb-4">Twój koszyk (<span th:text="${#lists.size(items)}"></span> produkty)</h2>

                <div th:if="${#lists.isEmpty(items)}" class="text-center p-5">
                    <i class="fa-solid fa-basket-shopping fa-3x text-secondary mb-3"></i>
                    <h3 class="h5">Twój koszyk jest pusty</h3>
                    <p class="text-secondary">Wygląda na to, że nic jeszcze nie dodałeś.</p>
                    <a th:href="@{/}" class="btn btn-primary-custom mt-2">Wróć do sklepu</a>
                </div>

                <div th:each="item : ${items}"
                     class="row g-3 align-items-center py-3 border-bottom"
                     th:attr="data-variant-id=${item.productVariantId}"> <div class="col-lg-2 col-md-3 col-4">
                    <img th:src="@{${item.imageUrl}}"
                         th:alt="${item.productName}"
                         class="cart-item-img"/>
                </div>

                    <div class="col-lg-4 col-md-5 col-8">
                        <a th:href="@{'/produkt/' + ${item.productSlug}}"
                           th:text="${item.productName}"
                           class="cart-item-title"></a>
                        <p class="cart-item-details mb-0"
                           th:text="'Rozmiar: ' + ${item.size} + ', Kolor: ' + ${item.color}">
                        </p>
                    </div>

                    <div class="col-lg-2 col-md-2 col-5">
                        <div class="input-group quantity-selector" style="width: 130px;">
                            <button class="btn btn-outline-secondary btn-decrease-qty" type="button">-</button>
                            <input type="text" class="form-control text-center quantity-input"
                                   th:value="${item.quantity}"
                                   readonly> <button class="btn btn-outline-secondary btn-increase-qty" type="button">+</button>
                        </div>
                    </div>

                    <div class="col-lg-2 col-md-2 col-4">
                        <span class="cart-item-price"
                              th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')} + ' zł'">
                        </span>
                    </div>

                    <div class="col-lg-2 col-md-0 col-3 text-end">
                        <button class="btn btn-remove btn-remove-item"
                                data-bs-toggle="tooltip"
                                title="Usuń z koszyka"
                                th:attr="data-item-id=${item.cartItemId}">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <div class="text-end mt-3" th:if="${not #lists.isEmpty(items)}">
                    <a th:href="@{/}" class="btn-link-custom">
                        <i class="fa-solid fa-arrow-left me-2"></i> Kontynuuj zakupy
                    </a>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="cart-card p-4">
                <h3 class="h5 mb-4">Podsumowanie zamówienia</h3>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Suma produktów:</span>
                    <span class="fw-bold" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')} + ' zł'"></span>
                </div>

                <div class="d-flex justify-content-between mb-3">
                    <span class="text-secondary">Szacowana dostawa:</span>
                    <span class="fw-bold">Darmowa</span> </div>

                <hr>

                <div class="d-flex justify-content-between summary-total mb-4">
                    <span>Łącznie (z VAT):</span>
                    <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')} + ' zł'"></span>
                </div>

                <a th:href="@{/zamowienie}"
                   class="btn btn-primary-custom btn-lg w-100"
                   th:classappend="${#lists.isEmpty(items)} ? 'disabled' : ''">
                    Przejdź do kasy
                    <i class="fa-solid fa-arrow-right ms-2"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        tooltipTriggerList.map(function (el) {
            return new bootstrap.Tooltip(el)
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        document.querySelectorAll(".btn-remove-item").forEach(btn => {
            btn.addEventListener("click", async () => {
                const itemId = btn.getAttribute("data-item-id");

                const res = await fetch(`/api/v1/cart/items/${itemId}`, {
                    method: "DELETE",
                    headers: { [csrfHeader]: csrfToken }
                });

                if (res.ok) {
                    location.reload();
                } else {
                    alert("Nie udało się usunąć produktu z koszyka.");
                }
            });
        });

        document.querySelectorAll(".btn-increase-qty").forEach(btn => {
            btn.addEventListener("click", async () => {
                const row = btn.closest("[data-variant-id]");
                const input = row.querySelector(".quantity-input");
                const itemId = row.querySelector(".btn-remove-item").getAttribute("data-item-id");

                const newQty = parseInt(input.value) + 1;
                await updateQuantity(itemId, newQty);
            });
        });

        document.querySelectorAll(".btn-decrease-qty").forEach(btn => {
            btn.addEventListener("click", async () => {
                const row = btn.closest("[data-variant-id]");
                const input = row.querySelector(".quantity-input");
                const itemId = row.querySelector(".btn-remove-item").getAttribute("data-item-id");

                const newQty = parseInt(input.value) - 1;
                await updateQuantity(itemId, newQty);
            });
        });

        async function updateQuantity(itemId, quantity) {
            const res = await fetch(`/api/v1/cart/items/${itemId}?quantity=${quantity}`, {
                method: "PATCH",
                headers: { [csrfHeader]: csrfToken }
            });

            if (res.ok) {
                location.reload(); // 💡
            } else {
                alert("Nie udało się zmienić ilości produktu.");
            }
        }
    });
</script>
</body>
</html>
