<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="theme-styles">
    <style th:if="${themeData}" th:inline="css">
        :root {
            --color-primary: [(${themeData.colorPrimaryHex})];
            --color-accent: [(${themeData.colorSecondaryHex})];
            --color-neutral-light: [(${themeData.colorAccentHex})];
            --color-neutral-dark: #222222;
            --color-header-text: #ffffff;
        }
    </style>
</th:block>
</body>
</html>
