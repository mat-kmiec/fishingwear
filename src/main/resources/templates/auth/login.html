<!DOCTYPE html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Logowanie</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />


  </head>
  <body style="background-color: var(--color-neutral-light)">
  <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card login-card">
            <div class="row g-0">
              
              <div class="col-lg-6 d-none d-lg-block">
                <img th:src="@{/uploads/products/other/login.jpg}"
                  src="../../static/images/other/login.jpg"
                  alt="Zdjęcie w tle logowania"
                  class="login-image"
                />
              </div>

              <div class="col-lg-6">
                <div class="p-4 p-md-5 bg-white">
                  <h2 class="h3 fw-bold mb-4 text-center">Witaj z powrotem!</h2>

                  <a th:href="@{/oauth2/authorization/github}" href="#" class="btn btn-github w-100 mb-2">
                    <i class="fa-brands fa-github me-2"></i> Kontynuuj przez
                    GitHub
                  </a>
                  <a th:href="@{/oauth2/authorization/google}" href="#" class="btn btn-google w-100 mb-3">
                    <i class="fa-brands fa-google me-2"></i> Kontynuuj przez
                    Google
                  </a>

                  <hr class="hr-text" data-content="LUB" />

                  <form th:action="@{/logowanie}" method="post">
                    <div class="form-floating mb-3">
                      <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="name@example.com"
                        name="username"
                        required
                      />
                      <label for="email">Adres e-mail</label>
                    </div>
                    <div class="form-floating mb-3">
                      <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Hasło"
                        name="password"
                        required
                      />
                      <label for="password">Hasło</label>
                    </div>
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />


                    <div class="text-end mb-3">
                      <a th:href="@{/resetowanie-hasla}" href="#" class="btn-link-custom"
                        >Nie pamiętasz hasła?</a
                      >
                    </div>

                    <button
                      type="submit"
                      class="btn btn-primary-custom w-100 btn-lg"
                    >
                      Zaloguj się
                    </button>
                  </form>

                  <p class="text-center text-secondary mt-4 mb-0">
                    Nie masz jeszcze konta?
                    <a th:href="@{/rejestracja}" href="#" class="btn-link-custom">Zarejestruj się</a>
                  </p>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

  <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
