<!DOCTYPE html>
<html lang="pl" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Resetowanie hasła</title>
    <th:block th:insert="fragments/head-styles :: theme-styles" />

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
            rel="stylesheet"
            th:href="@{/libs/bootstrap/bootstrap.min.css}"
            href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}"
            href="../../static/css/style.css"
    />
</head>

<body style="background-color: var(--color-neutral-light)">
<nav th:insert="~{fragments/nav :: nav}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card login-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-lock-open reset-icon"></i>
                </div>
                <h2 class="h3 fw-bold mb-3 text-center">Ustaw nowe hasło</h2>
                <p class="text-secondary text-center mb-4">
                    Wprowadź swoje nowe hasło i potwierdź, aby zakończyć proces resetowania.
                </p>

                <form
                        th:action="@{/reset-password}"
                        method="post"
                >
                    <!-- ukryty token -->
                    <input type="hidden" name="token" th:value="${token}" />

                    <div class="form-floating mb-3">
                        <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Nowe hasło"
                                required
                                minlength="8"
                        />
                        <label for="password">Nowe hasło</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Potwierdź hasło"
                                required
                                minlength="8"
                        />
                        <label for="confirmPassword">Potwierdź hasło</label>
                    </div>

                    <button
                            type="submit"
                            class="btn btn-primary-custom w-100 btn-lg mt-3"
                    >
                        Zresetuj hasło
                    </button>
                </form>

                <p th:text="${message}" style="color:green" class="mt-3 text-center"></p>
                <p th:text="${error}" style="color:red" class="mt-3 text-center"></p>

                <p class="text-center text-secondary mt-4 mb-0">
                    <a th:href="@{/logowanie}" href="/logowanie" class="btn-link-custom">Wróć do logowania</a>
                </p>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}"></footer>

<script
        th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
        src="../static/libs/bootstrap/bootstrap.bundle.min.js"
></script>

<script>
    const form = document.querySelector("form");
    form.addEventListener("submit", (e) => {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;
        if (pass !== confirm) {
            e.preventDefault();
            alert("Hasła muszą być identyczne!");
        }
    });
</script>
</body>
</html>
