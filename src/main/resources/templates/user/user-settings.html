<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Ustawienia konta</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

    <style>
      

    </style>
  </head>
  <body style="background-color: var(--color-neutral-light)">
    <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5">
      <div class="row g-4">

          <div th:replace="fragments/user-sidebar :: accountSidebar('settings')"></div>

        <div class="col-lg-8">
          <h2 class="h3 mb-4">Ustawienia konta</h2>

          <div class="account-card p-4 p-md-5 mb-4">
            <h3 class="h5 mb-4">Zmień hasło</h3>
            <form class="row g-3">
              <div class="col-12 form-floating">
                <input type="password" class="form-control" id="pass-current" placeholder="Obecne hasło">
                <label for="pass-current" class="ms-2">Obecne hasło</label>
              </div>
              <div class="col-12 form-floating">
                <input type="password" class="form-control" id="pass-new" placeholder="Nowe hasło">
                <label for="pass-new" class="ms-2">Nowe hasło</label>
              </div>
              <div class="col-12 form-floating">
                <input type="password" class="form-control" id="pass-repeat" placeholder="Powtórz nowe hasło">
                <label for="pass-repeat" class="ms-2">Powtórz nowe hasło</label>
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary-custom">Zapisz hasło</button>
              </div>
            </form>
          </div>
          
          <div class="account-card p-4 p-md-5 mb-4">
            <h3 class="h5 mb-4">Wybierz motyw witryny</h3>
            <div class="row g-3">
              
              <div class="col-md-4">
                <input type="radio" class="selection-card-input" name="theme" id="theme-olive" checked>
                <label class="selection-card" for="theme-olive">
                  <div class="theme-swatch" style="background: linear-gradient(90deg, #677525, #2e3b38, #f5f5f5);"></div>
                  <div class="theme-name">
                    <span>Oliwkowy</span>
                  </div>
                </label>
              </div>
              
              <div class="col-md-4">
                <input type="radio" class="selection-card-input" name="theme" id="theme-marine">
                <label class="selection-card" for="theme-marine">
                  <div class="theme-swatch" style="background: linear-gradient(90deg, #0a4d68, #088395, #f0eabe);"></div>
                  <div class="theme-name">
                    <span>Morski</span>
                  </div>
                </label>
              </div>
              
              <div class="col-md-4">
                <input type="radio" class="selection-card-input" name="theme" id="theme-graphite">
                <label class="selection-card" for="theme-graphite">
                  <div class="theme-swatch" style="background: linear-gradient(90deg, #343a40, #6c757d, #adb5bd);"></div>
                  <div class="theme-name">
                    <span>Grafit</span>
                  </div>
                </label>
              </div>
              
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
