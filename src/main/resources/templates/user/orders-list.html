<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishingWear - Historia zamówień</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link
      rel="stylesheet"
      th:href="@{/libs/bootstrap/bootstrap.min.css}"
      href="../../static/libs/bootstrap/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style.css}"
      href="../../static/css/style.css"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/slider.css}"
      href="../../static/css/slider.css"
    />

    <style>
      

    </style>
  </head>
  <body style="background-color: var(--color-neutral-light)">
    <nav th:insert="~{fragments/nav :: nav}"></nav>

    <div class="container my-5 min-vh-100">
      <div class="row g-4">
        
        <div class="col-lg-4">
          <div class="account-card p-4">
            <h3 class="h5 mb-3" style="color: var(--color-accent);">Witaj, Jan!</h3>
            <nav class="nav nav-pills flex-column account-nav">
              <a class="nav-link" href="#">Przegląd</a>
              <a class="nav-link active" aria-current="page" href="#">Historia zamówień</a>
              <a class="nav-link" href="#">Moje dane i adresy</a>
              <a class="nav-link" href="#">Ustawienia konta</a>
              <hr class="my-2">
              <a class="nav-link" href="#">Wyloguj się</a>
            </nav>
          </div>
        </div>

        <div class="col-lg-8">
          <h2 class="h3 mb-4">Historia zamówień</h2>

          <div class="accordion order-accordion" id="orderHistoryAccordion">

            <div class="accordion-item">
              <h2 class="accordion-header" id="headingOne">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                  <div class="d-flex flex-wrap w-100 justify-content-between align-items-center pe-3">
                    <div>
                      <span class="fw-bold d-block">Zamówienie #10023</span>
                      <span class="small text-secondary">01.11.2025</span>
                    </div>
                    <span class="badge badge-status completed my-2">Dostarczone</span>
                    <span class="fw-bold h5 mb-0" style="color: var(--color-primary);">415,96 zł</span>
                  </div>
                </button>
              </h2>
              <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#orderHistoryAccordion">
                <div class="accordion-body">
                  <a href="#" class="btn-link-custom">Zobacz szczególy zamówienia</a>
                </div>
              </div>
            </div>

            <div class="accordion-item">
              <h2 class="accordion-header" id="headingTwo">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                  <div class="d-flex flex-wrap w-100 justify-content-between align-items-center pe-3">
                    <div>
                      <span class="fw-bold d-block">Zamówienie #10022</span>
                      <span class="small text-secondary">28.10.2025</span>
                    </div>
                    <span class="badge badge-status shipped my-2">Wysłane</span>
                    <span class="fw-bold h5 mb-0" style="color: var(--color-primary);">112,98 zł</span>
                  </div>
                </button>
              </h2>
              <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#orderHistoryAccordion">
                <div class="accordion-body">
                  <a href="#" class="btn-link-custom">Zobacz szczególy zamówienia</a>
                </div>
              </div>
            </div>

            <div class="accordion-item">
              <h2 class="accordion-header" id="headingThree">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                  <div class="d-flex flex-wrap w-100 justify-content-between align-items-center pe-3">
                    <div>
                      <span class="fw-bold d-block">Zamówienie #10021</span>
                      <span class="small text-secondary">15.10.2025</span>
                    </div>
                    <span class="badge badge-status cancelled my-2">Anulowane</span>
                    <span class="fw-bold h5 mb-0" style="color: var(--color-primary);">249,99 zł</span>
                  </div>
                </button>
              </h2>
              <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#orderHistoryAccordion">
                <div class="accordion-body">
                  <p class="text-secondary">To zamówienie zostało anulowane.</p>
                  <a href="#" class="btn-link-custom">Zobacz szczególy zamówienia</a>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <footer th:insert="~{fragments/footer :: footer}"></footer>

    <script
      th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"
      src="../../static/libs/bootstrap/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
